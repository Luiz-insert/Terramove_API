spring.application.name=api-esg

# ===================================================================
# MongoDB Configuration
# ===================================================================
# A URI vem da variável de ambiente MONGODB_URI (Docker / Azure).
# Sem ela, usa o Mongo local na porta padrão.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/esg_db}

# ===================================================================
# Servidor
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# Ambiente / seed de dados
# ===================================================================
# Quando true, o DataLoader limpa e popula o banco ao iniciar.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.environment=${APP_ENVIRONMENT:local}

# ===================================================================
# Actuator (health check usado pelo Docker e pelo pipeline)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=TerraMove ESG API
info.app.environment=${app.environment}
info.app.version=${APP_VERSION:dev}

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
